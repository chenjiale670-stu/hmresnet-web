# Add these locations inside the existing HTTPS server block for
# fgaresnet.duckdns.org. The trailing slash in proxy_pass strips /hmresnet/ so
# the FastAPI app receives / and /api/*.

location = /hmresnet {
    return 301 /hmresnet/;
}

location ^~ /hmresnet/ {
    proxy_pass http://127.0.0.1:18012/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 700s;
    proxy_read_timeout 700s;
}
